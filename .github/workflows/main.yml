name: Deploy docs to Github Pages
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v2
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.x
      - name: Install dependencies
        run: pip install mkdocs-material
      - name: Install Flutter dependencies
        working-directory: speech_recognizer
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: speech_recognizer
        run: flutter analyze
      - name: Run Flutter tests with coverage
        working-directory: speech_recognizer
        run: flutter test --coverage
      - name: Report coverage
        run: |
          if [ ! -f speech_recognizer/coverage/lcov.info ]; then
            echo "speech_recognizer/coverage/lcov.info was not generated" >&2
            exit 1
          fi

          lines_found=$(awk -F: '/^LF:/ { total += $2 } END { print total + 0 }' speech_recognizer/coverage/lcov.info)
          lines_hit=$(awk -F: '/^LH:/ { total += $2 } END { print total + 0 }' speech_recognizer/coverage/lcov.info)
          coverage_percent=$(awk "BEGIN { if ($lines_found == 0) printf \"0.00\"; else printf \"%.2f\", ($lines_hit / $lines_found) * 100 }")
          q2_target="15.00"
          target_status=$(awk "BEGIN { print ($coverage_percent >= $q2_target) ? \"passed\" : \"failed\" }")
          badge_color=$(awk "BEGIN {
            if ($coverage_percent >= 80) print \"brightgreen\";
            else if ($coverage_percent >= 60) print \"green\";
            else if ($coverage_percent >= 40) print \"yellow\";
            else if ($coverage_percent >= 20) print \"orange\";
            else print \"red\";
          }")
          generated_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "## Test Coverage"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            echo "| Lines hit | $lines_hit |"
            echo "| Lines found | $lines_found |"
            echo "| Line coverage | ${coverage_percent}% |"
            echo "| Q2 target | >= ${q2_target}% |"
            echo "| Target status | ${target_status} |"
          } >> "$GITHUB_STEP_SUMMARY"

          mkdir -p docs
          cat > docs/coverage.md <<EOF
          # Test Coverage

          Latest CI line coverage is **${coverage_percent}%** (${lines_hit}/${lines_found} lines).

          | Metric | Value |
          | --- | ---: |
          | Lines hit | ${lines_hit} |
          | Lines found | ${lines_found} |
          | Line coverage | ${coverage_percent}% |
          | Q2 target | >= ${q2_target}% |
          | Target status | ${target_status} |

          Generated from [GitHub Actions run](${run_url}) at ${generated_at}.
          EOF

          cat > docs/coverage.json <<EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${coverage_percent}%",
            "color": "${badge_color}"
          }
          EOF

          echo "Line coverage: ${coverage_percent}% (${lines_hit}/${lines_found})"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: speech-recognizer-spanish-lcov
          path: speech_recognizer/coverage/lcov.info
          if-no-files-found: error
      - name: Deploy docs
        run: mkdocs gh-deploy --force
